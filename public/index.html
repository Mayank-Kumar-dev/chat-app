<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Car Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 1;
    }
  </style>
</head>
<body>
<div id="info">3D Car Viewer (Drag to rotate, Scroll to zoom)</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<!-- dat.GUI -->
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>

<script>
  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);

  // Camera
  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(5, 3, 8);

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(5, 10, 7);
  scene.add(directionalLight);

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshStandardMaterial({ color: 0x333333 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.5;
  scene.add(ground);

  // Car Group
  const car = new THREE.Group();
  scene.add(car);

  // Car Body
  const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(3, 0.8, 1.5),
    bodyMaterial
  );
  body.position.y = 0.4;
  car.add(body);

  // Car Top
  const top = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.6, 1.2),
    bodyMaterial
  );
  top.position.set(0, 0.9, 0);
  car.add(top);

  // Wheels
  const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const wheelGeometry = new THREE.CylinderGeometry(0.35, 0.35, 0.4, 32);

  function createWheel(x, z) {
    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.1, z);
    car.add(wheel);
  }

  createWheel(1.2, 0.8);
  createWheel(-1.2, 0.8);
  createWheel(1.2, -0.8);
  createWheel(-1.2, -0.8);

  // GUI
  const gui = new dat.GUI();
  const settings = {
    color: "#ff0000",
    rotationY: 0
  };

  gui.addColor(settings, "color").name("Car Color").onChange(value => {
    bodyMaterial.color.set(value);
  });

  gui.add(settings, "rotationY", -Math.PI, Math.PI)
     .name("Rotate Car")
     .onChange(value => {
       car.rotation.y = value;
     });

  // Resize
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>

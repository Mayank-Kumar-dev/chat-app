<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App | Live</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #00eaff;
    }

    p {
      font-size: 1rem;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .status {
      display: inline-block;
      background: #00c853;
      color: #000;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #00eaff;
      color: #000;
      font-weight: 600;
      border-radius: 30px;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00bcd4;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      opacity: 0.6;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>💬 Chat App</h1>
    <p>Real-time chat application powered by Node.js & PM2</p>

    <div class="status">🟢 Server Live</div>

    <br />

    <a href="#" class="btn">Launch Chat</a>

    <footer>
      Deployed via Jenkins CI/CD 🚀<br />
      © 2025 Mayank DevOps
    </footer>
  </div>

</body>
</html>

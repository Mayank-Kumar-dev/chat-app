<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mayank | DevOps Terminal</title>

  <style>
    body {
      margin: 0;
      background: #0d1117;
      color: #c9d1d9;
      font-family: "Fira Code", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .terminal {
      width: 90%;
      max-width: 820px;
      background: #010409;
      border-radius: 10px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .header {
      background: #161b22;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }

    .body {
      padding: 18px;
      font-size: 15px;
      line-height: 1.6;
    }

    .prompt {
      color: #58a6ff;
    }

    .cmd {
      color: #7ee787;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      background: #c9d1d9;
      margin-left: 4px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%,50% { opacity: 1 }
      51%,100% { opacity: 0 }
    }

    .muted { color: #8b949e; }
  </style>
</head>

<body>

<div class="terminal">
  <div class="header">
    <div class="dot red"></div>
    <div class="dot yellow"></div>
    <div class="dot green"></div>
  </div>

  <div class="body" id="terminal"></div>
</div>

<script>
  const terminal = document.getElementById("terminal");

  const lines = [
    { t: "mayank@cloud:~$ ", c: "prompt" },
    { t: "whoami", c: "cmd" },
    { t: "\nMayank Kumar\n", c: "" },

    { t: "mayank@cloud:~$ ", c: "prompt" },
    { t: "skills", c: "cmd" },
    { t: "\n• AWS • Azure • Docker • Terraform\n• CI/CD • Jenkins • Git • Linux\n\n", c: "" },

    { t: "mayank@cloud:~$ ", c: "prompt" },
    { t: "status", c: "cmd" },
    { t: "\nDevOps Engineer | Cloud Enthusiast\nActively building & learning 🚀\n\n", c: "" },

    { t: "mayank@cloud:~$ ", c: "prompt" }
  ];

  let i = 0;

  function typeLine() {
    if (i >= lines.length) return;

    const span = document.createElement("span");
    span.className = lines[i].c;
    terminal.appendChild(span);

    let j = 0;
    const text = lines[i].t;

    const typer = setInterval(() => {
      span.textContent += text[j];
      j++;
      if (j === text.length) {
        clearInterval(typer);
        i++;
        terminal.appendChild(document.createElement("br"));
        setTimeout(typeLine, 400);
      }
    }, 40);
  }

  typeLine();
</script>

</body>
</html>
